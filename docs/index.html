<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Docs — NeuroVault</title>
<meta name="description" content="Documentation for NeuroVault Core, the free MIT-licensed local memory engine, and the upcoming NeuroVault Desktop app." />
<meta name="theme-color" content="#0b0b12" />

<link rel="icon" type="image/png" href="../assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="./docs.css" />
<link rel="stylesheet" href="./lib/highlight-atom-dark.css" />

<!-- Apply stored theme before paint (avoids peach → blue flash on reload).
     Same script as the landing page so the user's choice persists across
     /index.html and /docs/. -->
<script>
  try {
    if (localStorage.getItem("nv.theme") === "light") {
      document.documentElement.setAttribute("data-theme", "light");
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", "#f5f8fd");
    }
  } catch (e) {}
</script>
</head>

<body class="docs-body">

<!-- Same nav as the landing page so the brand reads continuously.
     The "Docs" link is marked active. -->
<header class="nav">
  <a href="../index.html#top" class="nav-logo" aria-label="NeuroVault home">
    <img class="nav-logo-icon" src="../assets/mark-dark.png" width="32" height="32" alt="" />
    <img class="nav-logo-word" src="../assets/wordmark-dark.png" alt="NeuroVault" />
  </a>
  <nav class="nav-links">
    <a href="../index.html#method">How it works</a>
    <a href="../index.html#desktop">Desktop</a>
    <a href="https://github.com/sirdath/neurovault-core" target="_blank" rel="noopener">Core on GitHub ↗</a>
  </nav>
  <div class="nav-actions">
    <label class="themeToggle st-sunMoonThemeToggleBtn" for="themeToggle" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <input type="checkbox" id="themeToggle" class="themeToggleInput" />
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
        <mask id="moon-mask">
          <rect x="0" y="0" width="20" height="20" fill="white"></rect>
          <circle cx="11" cy="3" r="8" fill="black"></circle>
        </mask>
        <circle class="sunMoon" cx="10" cy="10" r="8" mask="url(#moon-mask)"></circle>
        <g class="sunRays">
          <circle class="sunRay sunRay1" cx="18" cy="10" r="1.5"></circle>
          <circle class="sunRay sunRay2" cx="14" cy="16.928" r="1.5"></circle>
          <circle class="sunRay sunRay3" cx="6" cy="16.928" r="1.5"></circle>
          <circle class="sunRay sunRay4" cx="2" cy="10" r="1.5"></circle>
          <circle class="sunRay sunRay5" cx="6" cy="3.072" r="1.5"></circle>
          <circle class="sunRay sunRay6" cx="14" cy="3.072" r="1.5"></circle>
        </g>
      </svg>
    </label>
    <a href="./" class="nav-docs" aria-current="page"><svg class="nav-docs-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Docs</a>
    <a href="https://github.com/sirdath/neurovault-core" class="nav-cta"><svg class="nav-cta-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l3 3-3 3"/><path d="M13 15h3"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>Get Core</a>
  </div>
</header>

<!-- Mobile sidebar toggle. On desktop the sidebar is always visible;
     on narrow screens it slides in/out. -->
<button id="sidebar-toggle" class="sidebar-toggle" type="button"
        aria-label="Open table of contents" aria-controls="docs-sidebar">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"/>
    <line x1="3" y1="6" x2="21" y2="6"/>
    <line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
  <span>Table of contents</span>
</button>

<main class="docs-layout">

  <!-- Sidebar: data-driven from docs.js so adding a page = one line.
       The sections / items mirror the markdown files in ./content/. -->
  <aside id="docs-sidebar" class="docs-sidebar" aria-label="Documentation navigation">
    <!-- Search trigger — opens the Cmd/Ctrl+K palette. -->
    <button id="docs-search-trigger" class="docs-search-trigger" type="button" aria-label="Search docs">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span>Search</span>
      <kbd class="docs-search-trigger-kbd">⌘K</kbd>
    </button>
    <nav class="docs-nav">
      <!-- docs.js populates this -->
    </nav>
  </aside>

  <!-- Content pane: rendered markdown lands in #docs-content. The
       hash-fragment from the URL picks which markdown file loads. -->
  <article class="docs-content-wrap">
    <div id="docs-content" class="docs-content">
      <!-- Initial state — replaced by rendered markdown once docs.js runs.
           Visible only briefly before the first fetch resolves. -->
      <p class="docs-loading">Loading documentation…</p>
    </div>

    <!-- Per-page footer with edit link + last-modified note.
         Populated by docs.js per page. -->
    <footer class="docs-page-footer">
      <p>
        Source on GitHub:
        <a id="docs-edit-link" href="https://github.com/sirdath/neurovault-core"
           target="_blank" rel="noopener">
          neurovault-core
        </a>
        — pull requests welcome.
      </p>
    </footer>
  </article>

  <!-- On-page TOC: built from the H2/H3 headings of the rendered page.
       Sticky on desktop so it follows the scroll. -->
  <aside class="docs-on-page-toc" aria-label="On-page table of contents">
    <p class="docs-on-page-toc-label">On this page</p>
    <ul id="docs-on-page-toc-list"></ul>
  </aside>

</main>

<!-- Vendored libraries — no CDN calls at runtime so docs work offline.
     marked: ~35 KB, MIT, https://github.com/markedjs/marked
     highlight.js: ~120 KB, BSD-3, https://github.com/highlightjs/highlight.js -->
<script src="./lib/marked.min.js"></script>
<script src="./lib/highlight.min.js"></script>
<script src="./docs.js"></script>

<!-- Reuse the landing-page theme toggle so light/dark/blue state stays
     consistent between /index.html and /docs/. -->
<script src="../script.js"></script>

</body>
</html>
