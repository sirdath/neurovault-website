name: Deploy site to GitHub Pages

# Deploys an explicit public allowlist. Prototype and legacy pages remain in
# git for design history but cannot become reachable through GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify public copy and local assets
        run: node check-site.mjs

      - name: Prepare public site artifact
        run: |
          mkdir -p _site/assets _site/docs/content _site/docs/lib
          cp index.html script.js styles.css CNAME _site/
          cp assets/favicon.svg assets/favicon.png _site/assets/
          cp assets/neurovault-mark.png _site/assets/
          cp assets/product-editor.webp assets/product-graph-3d.webp assets/product-today.webp _site/assets/
          cp docs/index.html docs/docs.js docs/docs.css _site/docs/
          cp -R docs/lib/. _site/docs/lib/
          cp docs/content/overview.md _site/docs/content/
          cp docs/content/quickstart.md _site/docs/content/
          cp docs/content/http-api.md _site/docs/content/
          cp docs/content/api-gateway-design.md _site/docs/content/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
